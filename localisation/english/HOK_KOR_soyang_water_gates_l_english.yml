l_english:
 #20261031_kpopmodder: Complete the inherited Soyang decisions with precise costs, bounded flooding and lifecycle cleanup.
 KOR_inundate_the_water_lines_desc:0 "Opening the floodgates to hinder movement through the Han River system can slow an advance towards the capital. Yet the water does not distinguish between enemy troops, civilians and our own soldiers. If we are to use Seoul and Chuncheon as a defensive line, we must accept damage to roads and factories as well.\n\nSpend 25 Political Power and prepare for 14 days. Flooding affects only the two provinces of Seoul and Chuncheon; building damage applies to each of the two states of Gyeonggi and Gangwon. Preparation is cancelled without a refund if the war ends or ownership, control or dam requirements are lost. If the same safety conditions cease to be met while flooding is active, the floodgates automatically return to normal operation."
 KOR_drain_the_water_lines_desc:0 "To use submerged roads again and gain access to factories, we must first lower the water level. We will lift the emergency measures taken for defence and return the floodgates to normal operation.\n\nSpend 25 Political Power to remove this floodgate operation's flooding effects from Seoul and Chuncheon after 14 days. Existing factory and infrastructure damage must be repaired separately. If the war ends or ownership, control or dam requirements are lost during the operation, the floodgates automatically return to normal operation without a refund."
 HOK_KOR_soyang_flooded:0 "Soyanggang Dam Emergency Release"
 HOK_KOR_soyang_flooded_desc:0 "An emergency release from Soyanggang Dam has disrupted movement and supply through the Han River system. Ending the release removes its flooding effects, but damaged facilities must be repaired separately."
 HOK_KOR_soyang_opening_started_tt:0 "Prepare to open the floodgates for 14 days. Once preparation is complete, the emergency release effects will apply to Seoul and Chuncheon."
 HOK_KOR_soyang_flood_effect_tt:0 "In the two provinces of §YSeoul and Chuncheon§!, apply §YSoyanggang Dam Emergency Release§!: defence §G+50%§!, movement speed §R-50%§!, entrenchment speed §R-20%§! and supply §R-40%§!, with increased organisation loss while moving and truck attrition.\nIn each of the two states of §YGyeonggi and Gangwon§!, damage §R1 level§! of infrastructure and §R0.5 levels each§! of civilian and military factories. Every subsequent opening causes the same damage again."
 HOK_KOR_soyang_draining_started_tt:0 "Restore normal floodgate operation over 14 days. The emergency release effects remain in place until the work is complete."
 HOK_KOR_soyang_normalized_tt:0 "Remove the emergency release effects caused by this floodgate operation in Seoul and Chuncheon. Damage to factories and infrastructure, and flooding from other causes, remain."
 HOK_KOR_soyang_cancelled_tt:0 "Cancel the floodgate operation and remove only its emergency release effects. Political Power already spent is not refunded."
