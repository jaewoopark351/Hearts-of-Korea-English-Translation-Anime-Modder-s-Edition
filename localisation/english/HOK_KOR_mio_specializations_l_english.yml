l_english:
#20261031_kpopmodder: Name Korean MIO specializations and explain separate trait purchase after focus availability.
 HOK_KOR_mio_trait_daewoo_standardized_parts:0 "Interchangeable Parts System"
 HOK_KOR_mio_trait_daewoo_standardized_parts_desc:0 "Standardise the specifications of chassis and drivetrain components to streamline assembly and improve the reliability of replacement parts in the field."
 HOK_KOR_mio_trait_rotem_reinforced_armor:0 "Heavy Tank Armour Joints"
 HOK_KOR_mio_trait_rotem_reinforced_armor_desc:0 "Design the joints between thick armour plates together with the supporting structure to improve the protection of heavy tanks."
 HOK_KOR_mio_trait_rygyeong_infantry_breakthrough:0 "Design for Infantry Support Fire"
 HOK_KOR_mio_trait_rygyeong_infantry_breakthrough_desc:0 "Improve gun layouts and observation equipment on tanks advancing alongside the infantry so they can break through defensive positions."
 HOK_KOR_mio_trait_doosan_mobile_powertrain:0 "Powertrains for Mobile Warfare"
 HOK_KOR_mio_trait_doosan_mobile_powertrain_desc:0 "Improve power transmission through the gearbox and engine to sustain speed in mobile warfare."
 HOK_KOR_mio_trait_kai_agile_airframes:0 "Agile Domestic Airframes"
 HOK_KOR_mio_trait_kai_agile_airframes_desc:0 "Establish design standards for domestically produced fighters that address both control response and turning performance."
 HOK_KOR_mio_trait_hanjin_long_range_navigation:0 "Long-Range Navigation Standards"
 HOK_KOR_mio_trait_hanjin_long_range_navigation_desc:0 "Standardise navigation equipment and fuel allocation for long-distance flights to extend the operational radius."
 HOK_KOR_mio_trait_jinhae_torpedo_sights:0 "Aerial Torpedo Sights"
 HOK_KOR_mio_trait_jinhae_torpedo_sights_desc:0 "Incorporate naval aviation torpedo-release data into the design to improve torpedo bombers' accuracy and striking power."
 HOK_KOR_mio_trait_daewoo_heavy_gun_mounts:0 "Large-Calibre Turret Supports"
 HOK_KOR_mio_trait_daewoo_heavy_gun_mounts_desc:0 "Reinforce the supporting structures and ammunition feed mechanisms of large-calibre main guns to increase the firepower of capital ships."
 HOK_KOR_mio_trait_hyundai_carrier_assembly:0 "Carrier Block Construction"
 HOK_KOR_mio_trait_hyundai_carrier_assembly_desc:0 "Preassemble flight deck and hangar sections to reduce the construction cost of aircraft carriers."
 HOK_KOR_mio_trait_daehan_escort_sonar:0 "Sonar Systems for Escorts"
 HOK_KOR_mio_trait_daehan_escort_sonar_desc:0 "Design escort ships' underwater detection equipment and depth-charge deployment areas together so they can locate and attack submarines."
 HOK_KOR_mio_trait_gms_torpedo_fire_control:0 "Raider Torpedo Fire Control"
 HOK_KOR_mio_trait_gms_torpedo_fire_control_desc:0 "Improve fire-control systems to calculate torpedo firing solutions rapidly during both long-range cruising and high-speed raids."
 HOK_KOR_mio_trait_gukgun_rifle_tooling:0 "Precision Rifle Machining"
 HOK_KOR_mio_trait_gukgun_rifle_tooling_desc:0 "Improve machining standards for barrels and actions to increase the infantry's ability to sustain fire."
 HOK_KOR_mio_trait_hanhwa_artillery_ammunition:0 "Consistent Artillery Ammunition"
 HOK_KOR_mio_trait_hanhwa_artillery_ammunition_desc:0 "Reduce manufacturing variations in shells and propellant charges to improve the effective firepower of field artillery."
 HOK_KOR_mio_trait_kia_economical_drivetrain:0 "Economical Transport Drivetrains"
 HOK_KOR_mio_trait_kia_economical_drivetrain_desc:0 "Adjust transport vehicles' drivetrains and engine settings to reduce fuel consumption for the same supply tasks."
 HOK_KOR_mio_trait_mmaa_support_standardization:0 "Common Support Equipment Standards"
 HOK_KOR_mio_trait_mmaa_support_standardization_desc:0 "Standardise shared components and procurement specifications for support equipment to reduce production costs."
 HOK_KOR_mio_specialization_purchase_tt:0 "This Military Industrial Organisation trait becomes available for selection. After acquiring the prerequisite traits, you must select it separately by spending the organisation's trait points."
