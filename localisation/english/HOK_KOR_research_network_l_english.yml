 HOK_KOR_nuclear_research_network_tt:0 "If we do not have a §YNuclear Research Facility§!, build §Y1§! facility in an owned core state that we fully control, giving priority to §Y$HOK_KOR_STATE_1028$§!. No facility will be built in a state that already has another experimental facility, and none will be added if no eligible state is available.\nRegardless of whether a facility is added, if §Y$KOR_sanglok_do$§! is in our country, their Nuclear Research specialisation level increases by §G1§!. This scientist development reward is granted only once."
