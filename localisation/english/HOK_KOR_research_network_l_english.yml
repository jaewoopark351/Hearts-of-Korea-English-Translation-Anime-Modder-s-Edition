#20261108_kpopmodder: Align descriptions with current recipient states and whole-region requirements; preserve rewards and lifecycle.
#20261031_kpopmodder: Explain conditional research-facility placement and independent one-time named-scientist training.
 HOK_KOR_land_research_network_tt:0 "If we do not have a §YLand Warfare Facility§!, build §Y1§! facility in an owned core state that we fully control, giving priority to §Y$STATE_525$§!. No facility will be built in a state that already has another experimental facility, and none will be added if no eligible state is available.\nRegardless of whether a facility is added, if §Y$KOR_yonggwan_kim$§! is in our country, their Land Warfare specialisation level increases by §G1§!. This scientist development reward is granted only once."
 HOK_KOR_naval_research_network_tt:0 "If we do not have a §YNaval Engineering Facility§!, build §Y1§! facility in an owned coastal core state that we fully control, giving priority to §Y$HOK_KOR_STATE_1086$§!. No facility will be built in a state that already has another experimental facility, and none will be added if no eligible state is available.\nRegardless of whether a facility is added, if §Y$KOR_bugil_hwang$§! is in our country, their Naval Engineering specialisation level increases by §G1§!. This scientist development reward is granted only once."
